<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGA — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #eef2ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 48px rgba(37, 99, 235, 0.12);
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 380px;
  }

  .brand {
    text-align: center;
    margin-bottom: 36px;
  }
  .brand-logo {
    font-size: 22px;
    font-weight: 800;
    color: #1e3a5f;
    letter-spacing: -0.5px;
  }
  .brand-logo .arrows { color: #2563eb; }
  .brand-sub {
    font-size: 11.5px;
    color: #94a3b8;
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 4px;
  }
  .card-sub {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 20px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #374151;
    margin-bottom: 6px;
  }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    padding: 10px 42px 10px 14px;
    border: 1.5px solid #d1d5db;
    border-radius: 9px;
    font-size: 14px;
    color: #111827;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    font-family: inherit;
    background: #fff;
  }
  .input-wrap input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
  }
  .toggle-pw {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #9ca3af;
    padding: 2px;
    display: flex;
    align-items: center;
    transition: color .15s;
  }
  .toggle-pw:hover { color: #374151; }
  .toggle-pw svg { width: 18px; height: 18px; }

  .btn {
    width: 100%;
    padding: 11px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .1s;
    font-family: inherit;
    margin-top: 4px;
  }
  .btn:hover  { background: #1d4ed8; }
  .btn:active { transform: scale(.98); }

  .error {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .error svg { width: 16px; height: 16px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-logo"><span class="arrows">&raquo;</span>SGA</div>
    <div class="brand-sub">Education &amp; Technology</div>
  </div>

  <div class="card-title">Acceso al sistema</div>
  <div class="card-sub">Ingresá tu usuario y contraseña para continuar.</div>

  <form method="POST" action="/login" autocomplete="off">
    <div id="errorBox" class="error" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Usuario o contraseña incorrectos. Intentá de nuevo.
    </div>

    <div class="field">
      <label for="username">Usuario</label>
      <div class="input-wrap">
        <input type="text" id="username" name="username" required autofocus placeholder="Ej. admin" autocapitalize="none" autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" required placeholder="••••••••••••" autocomplete="current-password">
        <button type="button" class="toggle-pw" id="togglePw" title="Mostrar/ocultar contraseña" aria-label="Mostrar contraseña">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field" id="codeField" style="display:none">
      <label for="code">Código de verificación (2FA)</label>
      <div class="input-wrap">
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 dígitos de tu app">
      </div>
    </div>

    <button type="submit" class="btn">Ingresar</button>
  </form>
</div>

<script>
  // Manejo de errores y de segundo factor
  (function () {
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    const errorBox = document.getElementById('errorBox');
    const codeField = document.getElementById('codeField');
    const u = params.get('u');
    if (u) { const un = document.getElementById('username'); if (un) un.value = u; }
    if (err === '3' || err === '4') {
      // Requiere/rechaza 2FA: mostrar campo de código y restaurar la contraseña
      codeField.style.display = 'block';
      errorBox.textContent = err === '4' ? 'Código de verificación incorrecto.' : 'Ingresá el código de verificación de tu app.';
      errorBox.style.display = 'flex';
      // Restaurar la contraseña ingresada antes (se guardó al enviar el formulario)
      try {
        const pw = sessionStorage.getItem('sga_pw_tmp');
        if (pw) { const p = document.getElementById('password'); if (p) p.value = pw; }
      } catch (e) {}
      setTimeout(() => document.getElementById('code').focus(), 50);
    } else if (err === '1') {
      errorBox.style.display = 'flex';
    } else if (err === '2') {
      errorBox.textContent = 'Demasiados intentos. Esperá unos minutos.';
      errorBox.style.display = 'flex';
    }
  })();

  // Toggle mostrar/ocultar contraseña
  const pwInput  = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');
  const eyeIcon  = document.getElementById('eyeIcon');

  const eyeOpen   = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  const eyeClosed = '<line x1="17.94" y1="17.94" x2="6.06" y2="6.06"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.24 6.24A18.33 18.33 0 0 0 1 12s4 8 11 8c2.28 0 4.32-.75 5.94-1.94"/>';

  toggleBtn.addEventListener('click', () => {
    const isPassword = pwInput.type === 'password';
    pwInput.type = isPassword ? 'text' : 'password';
    eyeIcon.innerHTML = isPassword ? eyeClosed : eyeOpen;
  });

  // Guardar la contraseña al enviar para no perderla en el paso de 2FA (se limpia al entrar a la app).
  // ponytail: se guarda solo en sessionStorage de este mismo origen y se borra tras el login.
  document.querySelector('form').addEventListener('submit', () => {
    try { sessionStorage.setItem('sga_pw_tmp', pwInput.value); } catch (e) {}
  });
</script>
</body>
</html>
